name: CI

on:
  push:
    branches: [main]
  pull_request:

# O job só lê o código; nada de escrita no repositório.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # O projeto "storybook" do Vitest roda as stories num Chromium de verdade.
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - run: npm run size
